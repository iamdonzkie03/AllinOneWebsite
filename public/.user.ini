; PHP upload limits for the Z.C. commonplace Media Gallery.
; These per-directory settings are honored by PHP CGI/FastCGI (including PHP-FPM).
; If Laragon is running PHP as an Apache module, set the same values in the active php.ini.
upload_max_filesize = 10M
post_max_size = 220M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
